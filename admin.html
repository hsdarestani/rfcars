<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RF Cars Beheer</title><link rel="stylesheet" href="/assets/styles.css"></head><body class="admin-body"><section id="loginView" class="login-card"><div class="brand"><span class="brand-mark">RF</span><span class="brand-copy">CARS<small>BEHEER</small></span></div><h1>Voorraadbeheer</h1><p>Log in om wagens toe te voegen, te wijzigen, als verkocht te markeren of te verwijderen.</p><form id="loginForm"><input id="password" type="password" placeholder="Beheerderswachtwoord" autocomplete="current-password" required><button type="submit">Inloggen</button><div class="notice" id="loginNotice"></div></form></section><main id="adminView" class="admin-shell" hidden><header class="admin-head"><div><h1>Voorraadbeheer</h1><p>RF Cars · wijzigingen staan direct live.</p></div><button id="logoutBtn" class="secondary-action">Uitloggen</button></header><div class="admin-grid"><section class="panel"><h2 id="formTitle">Nieuwe wagen</h2><form id="carForm"><input type="hidden" id="carId"><div class="form-grid"><label class="full">Titel<input id="title" required placeholder="Bijv. BMW 320d Touring"></label><label>Merk<input id="make" placeholder="BMW"></label><label>Model<input id="model" placeholder="320d Touring"></label><label>Bouwjaar<input id="yearField" type="number"></label><label>Prijs €<input id="price" type="number"></label><label>Kilometerstand<input id="mileage" type="number"></label><label>Brandstof<select id="fuel"><option>DIESEL</option><option>BENZINE</option><option>HYBRIDE</option><option>ELEKTRISCH</option><option>LPG</option></select></label><label>Transmissie<select id="transmission"><option>Manueel</option><option>Automaat</option></select></label><label>Vermogen kW<input id="power" type="number"></label><label>Motorinhoud<input id="engine" placeholder="2.0L"></label><label>Milieuklasse<input id="euroClass" placeholder="Euro 6"></label><label>Kleur<input id="color" placeholder="Zwart"></label><label>Zitplaatsen<input id="seats" type="number"></label><label>Status<select id="status"><option value="available">Beschikbaar</option><option value="sold">Verkocht</option></select></label><label class="full">Beschrijving<textarea id="description" rows="5"></textarea></label><label class="full">Opties, één per regel<textarea id="options" rows="4" placeholder="Airconditioning&#10;Navigatie&#10;Parkeersensoren"></textarea></label></div><div class="upload-zone"><strong>Foto's</strong><br>Selecteer één of meerdere foto's. Ze worden automatisch opgeslagen.<input id="photos" type="file" accept="image/*" multiple><div id="imagePreview" class="image-preview"></div></div><div class="admin-actions"><button class="primary-action" type="submit" id="saveBtn">Wagen opslaan</button><button class="secondary-action" type="button" id="resetBtn">Leegmaken</button></div><div class="notice" id="formNotice"></div></form></section><section class="panel"><h2>Huidige voorraad</h2><div id="adminList" class="admin-list">Laden…</div></section></div></main><script src="/assets/admin.js" defer></script></body></html>
